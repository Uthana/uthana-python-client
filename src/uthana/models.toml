# Default models for Uthana API endpoints.
# The first model in each list is used when model="auto".

[ttm]
default = "text-to-motion-1.0"
models = ["text-to-motion-1.0", "text-to-motion-2.0"]

[vtm]
default = "video-to-motion-2.0"
models = ["video-to-motion-2.0", "video-to-motion-2.1", "video-to-motion-v2"]
